<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBT - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow-y: auto; align-items: flex-start; display: block; }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <nav class="navbar">
    <span class="nav-brand">KBT</span>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="home">Home</button>
      <button class="nav-tab" data-tab="profile">Profile</button>
    </div>
    <button class="nav-logout" id="logoutBtn">Log out</button>
  </nav>

  <main class="page">

    <section class="page-tab active" id="tab-home">
      <h2 class="page-title" id="welcomeMsg">Welcome</h2>
      <p class="page-sub">Your sites, all in one place.</p>
      <div class="site-grid" id="siteGrid">
        <p class="empty-state">Loading...</p>
      </div>
    </section>

    <section class="page-tab" id="tab-profile">
      <h2 class="page-title">Profile</h2>
      <p class="page-sub">Your account details.</p>
      <div class="profile-card">
        <div class="profile-row"><span class="label">Username</span><span class="value" id="profUsername">-</span></div>
        <div class="profile-row"><span class="label">Role</span><span class="value" id="profRole">-</span></div>
      </div>
    </section>

  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
