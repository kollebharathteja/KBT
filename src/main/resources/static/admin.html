<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBT - K Control Panel</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow-y: auto; align-items: flex-start; padding: 60px 20px; }
  .card { width: 640px; text-align: left; }
  h2 { color: var(--text); margin: 4px 0 2px; text-align: center; }
  .sub { color: var(--text-dim); font-size: 13px; text-align: center; margin-bottom: 24px; }
  .panel-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .panel-row input, .panel-row select {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 13px; outline: none;
  }
  .add-btn { width: auto; padding: 10px 22px; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; color: var(--text); }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  th { color: var(--text-dim); font-weight: 600; }
  .del { color: #ff9d9d; cursor: pointer; background: none; border: none; font-size: 13px; }
  .section-title { margin: 26px 0 4px; color: var(--text); font-size: 14px; letter-spacing: 1px; }
  .logout-btn { margin-top: 22px; width: auto; padding: 10px 22px; background: transparent; border: 1px solid var(--glass-border); color: var(--text); }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="card">
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/></svg>
    </div>
    <p class="brand" style="text-align:center;">KBT</p>
    <h2>K Control Panel</h2>
    <p class="sub">Add, edit or remove any content block on the site. Changes are read live by the front-end.</p>

    <div class="panel-row">
      <input type="text" id="ckey" placeholder="key (e.g. hero.title)">
      <input type="text" id="csection" placeholder="section (e.g. home)">
    </div>
    <div class="panel-row">
      <input type="text" id="cvalue" placeholder="value">
      <button class="submit-btn add-btn" id="saveContentBtn">SAVE</button>
    </div>

    <p class="section-title">SITE CONTENT</p>
    <table id="contentTable">
      <thead><tr><th>Key</th><th>Section</th><th>Value</th><th></th></tr></thead>
      <tbody></tbody>
    </table>

    <p class="section-title">
      WEBSITES (shown as cards on every user's Home tab)
      <button class="plus-btn" id="openWebsiteModal" title="Add website">+</button>
    </p>
    <div class="website-preview-grid" id="websitePreviewGrid"></div>

    <p class="section-title">USERS</p>
    <table id="usersTable">
      <thead><tr><th>Username</th><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody></tbody>
    </table>

    <button class="submit-btn logout-btn" id="logoutBtn">LOG OUT</button>
  </main>

  <!-- Add Website modal -->
  <div class="modal-backdrop" id="websiteModalBackdrop">
    <div class="modal-card">
      <div class="modal-header">
        <span>Add a website</span>
        <button class="modal-close" id="closeWebsiteModal">&times;</button>
      </div>
      <div class="panel-row">
        <input type="text" id="wtitle" placeholder="Name (e.g. My Portfolio)">
      </div>
      <div class="panel-row">
        <input type="text" id="wurl" placeholder="https://example.com">
      </div>
      <div class="panel-row">
        <input type="text" id="wimage" placeholder="Image URL (optional)">
      </div>
      <div class="panel-row">
        <input type="text" id="wdesc" placeholder="Short description">
      </div>
      <button class="submit-btn add-btn" id="saveWebsiteBtn" style="width:100%">ADD WEBSITE</button>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
