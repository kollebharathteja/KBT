spring.application.name=KBT

# ---------------------------------------------------------------------------
# MongoDB Atlas
# Replace <username>, <password>, <cluster-url>, <dbname> with your own,
# or (better/safer) set the MONGODB_URI environment variable instead of
# editing this file, e.g.:
#   export MONGODB_URI="mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/kbt?retryWrites=true&w=majority"
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://<username>:<password>@<cluster-url>/kbt?retryWrites=true&w=majority}

# ---------------------------------------------------------------------------
# JWT
# Set a long, random KBT_JWT_SECRET in production (env var). Do not commit real secrets.
# ---------------------------------------------------------------------------
kbt.jwt.secret=${KBT_JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-chars-please}
kbt.jwt.expiration-ms=${KBT_JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Super admin "K" - the master account that can change everything on the site.
# Set KBT_SUPERADMIN_PASSWORD as an environment variable in production;
# never leave the default password in a deployed app.
# ---------------------------------------------------------------------------
kbt.super-admin.username=K
kbt.super-admin.email=${KBT_SUPERADMIN_EMAIL:k@kbt.local}
kbt.super-admin.password=${KBT_SUPERADMIN_PASSWORD:ChangeMeNow!123}

server.port=${PORT:8080}
