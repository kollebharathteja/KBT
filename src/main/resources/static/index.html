<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="card" id="card">

    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="8" r="4" fill="currentColor"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/>
      </svg>
    </div>

    <h1 class="brand">KBT</h1>

    <!-- ============ LOGIN FORM ============ -->
    <form id="loginForm" class="form active" autocomplete="off">
      <div class="field">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.2.5 7.4 5.6a1 1 0 0 0 1.2 0L20.2 6H4.2Z" fill="currentColor"/></svg>
        </span>
        <input type="text" id="loginEmail" placeholder="Email ID" required>
      </div>

      <div class="field">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h8V8a4 4 0 1 0-8 0v2Zm4 4a1.5 1.5 0 0 0-1 2.6V19h2v-2.4A1.5 1.5 0 0 0 12 14Z" fill="currentColor"/></svg>
        </span>
        <input type="password" id="loginPassword" placeholder="Password" required>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot" id="forgotLink">Forgot Password?</a>
      </div>

      <p class="error" id="loginError"></p>

      <button type="submit" class="submit-btn" id="loginBtn">LOGIN</button>

      <p class="switch">New to KBT? <a href="#" id="showSignup">Create an account</a></p>
    </form>

    <!-- ============ SIGNUP FORM ============ -->
    <form id="signupForm" class="form" autocomplete="off">
      <div class="field">
        <span class="icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="currentColor"/></svg>
        </span>
        <input type="text" id="signupUsername" placeholder="Username" required>
      </div>

      <div class="field">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.2.5 7.4 5.6a1 1 0 0 0 1.2 0L20.2 6H4.2Z" fill="currentColor"/></svg>
        </span>
        <input type="email" id="signupEmail" placeholder="Email ID" required>
      </div>

      <div class="field">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1Zm2 0h8V8a4 4 0 1 0-8 0v2Zm4 4a1.5 1.5 0 0 0-1 2.6V19h2v-2.4A1.5 1.5 0 0 0 12 14Z" fill="currentColor"/></svg>
        </span>
        <input type="password" id="signupPassword" placeholder="Password" required>
      </div>

      <p class="error" id="signupError"></p>

      <button type="submit" class="submit-btn" id="signupBtn">SIGN UP</button>

      <p class="switch">Already have an account? <a href="#" id="showLogin">Log in</a></p>
    </form>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
